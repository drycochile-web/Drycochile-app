<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Diagnóstico rápido de su techo · Dryco Chile</title><link rel="icon" type="image/png" href="../icons/favicon-32.png">
<style>
:root{--navy:#0B1630;--ink:#0D1B2E;--mut:#5B6B80;--line:#D7DFEA;--acc:#1F5CA1;--accs:#E8F0FB;--soft:#F8FAFD;--ok:#16865A;--warn:#B45309;--wa:#1E8E3E}
*{box-sizing:border-box}html,body{margin:0}body{background:transparent;color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.45}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;max-width:760px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.eyebrow{font:700 12px/1 Arial,sans-serif;letter-spacing:.12em;color:var(--acc);text-transform:uppercase}
h2{margin:6px 0 2px;font-size:22px;line-height:1.2}
.sub{color:var(--mut);margin:0 0 4px;font-size:14px}
.bar{height:6px;background:#EEF2F8;border-radius:99px;margin:16px 0 18px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.q{font-weight:700;font-size:17px;margin:0 0 12px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--soft);border-radius:14px;padding:14px;font:inherit;color:inherit;cursor:pointer;min-height:64px;transition:border-color .15s,background .15s}
.opt:hover{border-color:#9DBCE6}.opt:focus-visible{outline:3px solid #9DBCE6;outline-offset:2px}
.opt.on{border-color:var(--acc);background:var(--accs)}
.opt svg{flex:0 0 30px;width:30px;height:30px;color:var(--acc)}
.opt b{display:block;font-size:15px}.opt span{display:block;color:var(--mut);font-size:13px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.lnk{background:none;border:0;color:var(--acc);font:600 14px Arial,sans-serif;cursor:pointer;padding:8px 0}
.lnk[disabled]{visibility:hidden}
.res h3{margin:0 0 4px;font-size:20px}
.tag{display:inline-block;font:700 12px Arial,sans-serif;padding:5px 10px;border-radius:99px;background:var(--accs);color:var(--acc);margin-bottom:10px}
.tag.urg{background:#FDECEC;color:#B42318}.tag.ok{background:#E5F5EE;color:var(--ok)}
.box{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0;background:var(--soft)}
.box h4{margin:0 0 6px;font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.box ul{margin:0;padding-left:18px}.box li{margin:3px 0}
.cta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:14px;font:700 15px Arial,sans-serif;text-decoration:none;cursor:pointer;text-align:center}
.btn svg{width:20px;height:20px}
.btn.wa{background:var(--wa);color:#fff}.btn.pri{background:var(--acc);color:#fff}
.fine{color:var(--mut);font-size:12.5px;margin:12px 0 0;text-align:center}
@media (max-width:560px){.card{padding:18px;border-radius:16px}h2{font-size:20px}.opts{grid-template-columns:1fr}.cta{grid-template-columns:1fr}}
</style></head><body>
<div class="card" id="app" aria-live="polite"></div>
<script>
var WA="56956069678",COT="https://drycochile.cl/cotizacion-de-impermeabilizacion";
var IC={
 losa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 10h18v3H3zM5 13v7M19 13v7M9 13v7M15 13v7"/></svg>',
 teja:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 12 12 4l10 8"/><path d="M5 10v10h14V10"/><path d="M7 14h10M7 17h10"/></svg>',
 metal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 9l9-5 9 5v2H3z"/><path d="M5 11v9M9 11v9M13 11v9M17 11v9"/></svg>',
 shingle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 13 12 5l10 8"/><path d="M6 12h4v3H6zM10 12h4v3h-4zM14 12h4v3h-4zM8 15h4v3H8zM12 15h4v3h-4z"/></svg>',
 nose:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg>',
 gota:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/></svg>',
 mancha:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 10c1-2 3-2 4 0s3 2 4 0M7 15c2 1 4 1 6-1"/></svg>',
 vieja:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 18h18"/><path d="M5 18l3-6 3 3 3-7 5 10"/></svg>',
 sol:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></svg>',
 casa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10M10 20v-6h4v6"/></svg>',
 edif:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="3" width="14" height="18"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M9 15h2M13 15h2"/></svg>',
 ind:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 20V10l5 3V10l5 3V7l8 4v9z"/></svg>',
 m2:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="16" height="16"/><path d="M4 9h16M9 4v16"/></svg>',
 wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.7-.1l.9-1.1c.2-.3.4-.2.7-.1l2 1c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>',
 cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>'};
var Q=[
 {k:"techo",q:"¿Qué tipo de techo tiene?",o:[["losa","Losa plana o azotea","Hormigón, terraza superior o cubierta de edificio"],["teja","Techo de tejas","Arcilla, cemento o tejuela"],["metal","Techo metálico o de zinc","Planchas, zincalum o cubierta de bodega"],["shingle","Tejas asfálticas (shingle)","La llamada cubierta americana"],["nose","No estoy seguro","Lo vemos en la visita"]]},
 {k:"prob",q:"¿Qué está pasando?",o:[["gota","Goteras cuando llueve","Entra agua al interior"],["mancha","Manchas o humedad en el cielo","Pintura soplada, hongos, olor a humedad"],["vieja","Membrana o techo envejecido","Grietas, ampollas, piezas sueltas u óxido"],["sol","Quiero prevenir antes de las lluvias","Revisión y mantención"]]},
 {k:"inm",q:"¿Qué tipo de inmueble es?",o:[["casa","Casa","Vivienda particular"],["edif","Edificio o comunidad","Administración o comité"],["ind","Empresa, bodega o industria","Local, oficina, planta o colegio"]]},
 {k:"m2",q:"¿Qué superficie tiene, aproximadamente?",o:[["chico","Menos de 50 m²",""],["medio","Entre 50 y 200 m²",""],["grande","Más de 200 m²",""],["nose","No lo sé","Lo medimos en la visita"]]}];
var A={},step=0;
function lbl(k,v){var q=Q.filter(function(x){return x.k===k})[0];var o=q&&q.o.filter(function(x){return x[0]===v})[0];return o?o[1]:""}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function height(){try{parent.postMessage({dryco:"altura",h:document.documentElement.scrollHeight},"*")}catch(e){}}
function ev(name){try{parent.postMessage({dryco:name},"*")}catch(e){}try{if(top!==parent)top.postMessage({dryco:name},"*")}catch(e){}}
function render(){var el=document.getElementById("app");
  if(step>=Q.length){el.innerHTML=result();height();return}
  var q=Q[step];
  el.innerHTML='<div class="top"><div><div class="eyebrow">Diagnóstico rápido · paso '+(step+1)+' de '+Q.length+'</div><h2>¿Por dónde entra el agua?</h2><p class="sub">Responda 4 preguntas y le decimos qué revisar y qué solución suele corresponder.</p></div></div>'+
   '<div class="bar"><i style="width:'+(step/Q.length*100)+'%"></i></div><p class="q" id="q">'+q.q+'</p><div class="opts" role="group" aria-labelledby="q">'+
   q.o.map(function(o){var ic=IC[o[0]]||IC.m2;return '<button class="opt'+(A[q.k]===o[0]?" on":"")+'" data-v="'+o[0]+'">'+ic+'<div><b>'+o[1]+'</b>'+(o[2]?'<span>'+o[2]+'</span>':'')+'</div></button>'}).join("")+'</div>'+
   '<div class="nav"><button class="lnk" data-back="1"'+(step?'':' disabled')+'>← Volver</button><span class="sub">Sin datos personales</span></div>';
  height()}
function reco(){var t=A.techo,p=A.prob,i=A.inm,R={tag:"",tagc:"",tit:"",causa:[],sol:[],visita:[]};
  if(p==="gota"){R.tag="Conviene revisar pronto";R.tagc="urg"}else if(p==="sol"){R.tag="Buen momento: primavera y verano son ideales";R.tagc="ok"}else{R.tag="Recomendado antes de las lluvias";R.tagc=""}
  if(t==="losa"){R.tit="Losa o azotea: membrana líquida continua";R.causa=["Desagües o gárgolas obstruidos y agua que se estanca","Encuentros muro-losa, antepechos y ductos sin refuerzo","Fisuras en la losa o membrana que cumplió su vida útil"];R.sol=["Membrana líquida de poliuretano, sin juntas y con sello protector UV: resiste agua estancada y tránsito de mantención","Revestimiento acrílico elastomérico si la losa tiene buena pendiente y se busca mantención","Refuerzo con geotextil en encuentros y desagües"]}
  else if(t==="teja"){R.tit="Techo de tejas: piezas, hojalatería y encuentros";R.causa=["Tejas rotas, corridas o mal fijadas","Canaletas, limahoyas o botaguas oxidados o desprendidos","Sellos resecos en chimeneas, ductos y encuentros con muros"];R.sol=["Cambio y fijación mecánica de tejas dañadas","Hojalatería: canaletas, limahoyas, botaguas y forros","Sellos elásticos de poliuretano en los encuentros"]}
  else if(t==="metal"){R.tit="Techo metálico: traslapos, fijaciones y óxido";R.causa=["Traslapos y fijaciones que se soltaron con la dilatación","Óxido y perforaciones en planchas o canaletas","Encuentros con muros, lucarnas o equipos sin sello"];R.sol=["Sellado de traslapos, pernos y fijaciones","Tratamiento de óxido y membrana líquida sobre la cubierta","Revisión de canaletas y bajadas de agua"]}
  else if(t==="shingle"){R.tit="Tejas asfálticas: sellos y puntos críticos";R.causa=["Tejas levantadas o desgastadas por sol y viento","Limahoyas, cumbreras y encuentros con muros","Ventilaciones y ductos sin sello"];R.sol=["Reparación de las piezas y puntos afectados","Sellos elásticos y hojalatería en encuentros","Membrana líquida compatible en zonas críticas cuando corresponde"]}
  else{R.tit="Lo definimos con una visita técnica";R.causa=["El origen casi nunca está donde aparece la mancha","Suele estar en desagües, juntas, encuentros o una membrana envejecida"];R.sol=["Diagnóstico en terreno y propuesta escrita con el sistema que corresponde a su techo"]}
  R.visita=["Origen exacto de la filtración y estado de la superficie","Pendientes, desagües, juntas y encuentros, con registro fotográfico","Propuesta escrita con sistema, plazo y precio por m²"];
  if(p==="mancha")R.causa.unshift("La mancha suele aparecer lejos del punto por donde entra el agua");
  if(i==="edif")R.extra="Trabajamos con el edificio habitado, coordinamos con la administración y controlamos el polvo con aspiración HEPA.";
  else if(i==="ind")R.extra="Trabajamos por sectores para no detener la operación, con control de polvo en el origen.";
  else R.extra="Trabajo limpio, con prueba de agua al terminar y garantía escrita.";
  return R}
function waText(){var R=reco();return "Hola Dryco, hice el diagnóstico rápido en su web:\n• Techo: "+lbl("techo",A.techo)+"\n• Situación: "+lbl("prob",A.prob)+"\n• Inmueble: "+lbl("inm",A.inm)+"\n• Superficie: "+lbl("m2",A.m2)+"\nMe gustaría coordinar una visita técnica. Mi comuna es: "}
function result(){var R=reco();
  return '<div class="res"><div class="eyebrow">Su diagnóstico rápido</div><span class="tag '+R.tagc+'" style="margin-top:8px">'+esc(R.tag)+'</span><h3>'+esc(R.tit)+'</h3><p class="sub">'+esc(R.extra)+'</p>'+
   '<div class="box"><h4>Causas más probables</h4><ul>'+R.causa.map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ul></div>'+
   '<div class="box"><h4>Solución que suele corresponder</h4><ul>'+R.sol.map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ul></div>'+
   '<div class="box"><h4>Qué revisamos en la visita</h4><ul>'+R.visita.map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ul></div>'+
   '<div class="cta"><a class="btn wa" data-wa="1" target="_blank" rel="noopener" href="https://wa.me/'+WA+'?text='+encodeURIComponent(waText())+'">'+IC.wa+'Enviar por WhatsApp</a><a class="btn pri" data-cot="1" target="_top" href="'+COT+'">'+IC.cal+'Agendar visita técnica</a></div>'+
   '<p class="fine">Orientación general: la solución definitiva se confirma en la visita técnica. <button class="lnk" data-reset="1" style="font-size:12.5px">Volver a empezar</button></p></div>'}
document.addEventListener("click",function(e){var b=e.target.closest("[data-v],[data-back],[data-reset],[data-wa],[data-cot]");if(!b)return;
  if(b.dataset.v){A[Q[step].k]=b.dataset.v;step++;if(step===1)ev("diagnostico_inicio");if(step>=Q.length)ev("diagnostico_fin");render();return}
  if(b.dataset.back){if(step>0)step--;render();return}
  if(b.dataset.reset){A={};step=0;render();return}
  if(b.dataset.wa){ev("diagnostico_whatsapp");return}
  if(b.dataset.cot){ev("diagnostico_visita")}});
window.addEventListener("load",height);window.addEventListener("resize",height);
render();
</script></body></html>
