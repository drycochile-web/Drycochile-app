/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function money(n){n=Math.round(+n||0);return (n<0?"−$":"$")+Math.abs(n).toLocaleString("es-CL")}
function num(n){return (+n||0).toLocaleString("es-CL",{maximumFractionDigits:2})}
function pad(n){return (n<10?"0":"")+n}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function today(){return iso(new Date())}
function addDays(s,n){var p=s.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()+n);return iso(d)}
function pdate(s){if(!s)return null;var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function fdate(s,long){var d=pdate(s);if(!d)return "";return d.toLocaleDateString("es-CL",long?{weekday:"long",day:"numeric",month:"long"}:{day:"numeric",month:"short",year:(s.slice(0,4)==today().slice(0,4)?undefined:"numeric")})}
function sum(a,f){return a.reduce(function(t,x){return t+(+f(x)||0)},0)}
function byId(c,id){if(!id)return null;for(var i=0;i<S[c].length;i++)if(S[c][i].id===id)return S[c][i];return null}
function nameOf(c,id){var r=byId(c,id);if(!r)return "";return c==="cotizaciones"?("COT "+r.numero):(r.nombre||r.titulo||"")}
function ventaTotal(v){return Math.round((+v.cantidad||0)*(+v.precioUnit||0)+(+v.despacho||0))}
function obraCalc(o){var g=sum(S.gastos.filter(function(x){return x.obraId===o.id}),function(x){return x.monto});var c=sum(S.cobros.filter(function(x){return x.obraId===o.id}),function(x){return x.monto});var neto=+o.neto||0;var total=o.conIva==="No"?Math.round(neto):Math.round(neto*(1+IVA));return {gastos:g,cobrado:c,total:total,porCobrar:Math.max(0,total-c),ganancia:neto-g,margen:neto?(neto-g)/neto:0}}
function obraFecha(o){return o.termino||o.inicio||((byId("cotizaciones",o.cotizacionId)||{}).fecha)||""}
/* Resultados por mes: cada obra cuenta completa (venta y todos sus gastos) en el mes en que termina.
   Las obras sin terminar no suman hasta que terminan; sus números nunca se reparten entre meses.
   Los gastos generales (sin obra) cuentan en el mes de su fecha. */
function mesesRes(){
  var M={};function g(m){return M[m]||(M[m]={mes:m,obras:[],neto:0,gastosObras:0,gastosGen:0})}
  S.obras.forEach(function(o){if(o.estado!=="Terminada")return;var m=obraFecha(o).slice(0,7);if(!m)return;var k=obraCalc(o),r=g(m);r.obras.push(o);r.neto+=+o.neto||0;r.gastosObras+=k.gastos});
  S.gastos.forEach(function(x){if(x.obraId&&byId("obras",x.obraId))return;var m=(x.fecha||"").slice(0,7);if(!m)return;g(m).gastosGen+=+x.monto||0});
  Object.keys(M).forEach(function(m){var r=M[m];r.gastos=r.gastosObras+r.gastosGen;r.ganancia=r.neto-r.gastos;r.margen=r.neto?r.ganancia/r.neto:0});
  return M;
}
function enProceso(){var l=S.obras.filter(function(o){return o.estado!=="Terminada"});return {obras:l,neto:sum(l,function(o){return o.neto}),gastos:sum(l,function(o){return obraCalc(o).gastos})}}
function mesLabel(m,long){return pdate(m+"-01").toLocaleDateString("es-CL",long?{month:"long",year:"numeric"}:{month:"short"})}
function pillFor(v){var m={"Aceptada":"ok","Terminada":"ok","Enviada":"acc","En curso":"acc","Programada":"warn","Borrador":"","Pausada":"warn","Rechazada":"bad"};return '<span class="pill '+(m[v]||"")+'">'+esc(v)+'</span>'}

var db=null,downloads=null,stTimer=null;
function setStatus(ok,text){var s=document.getElementById("status");s.className="status"+(ok?" ok":"");s.innerHTML="<i></i>"+esc(text)}
function start(){
  window.claude&&window.claude.use&&window.claude.use("downloads").then(function(d){downloads=d;render()}).catch(function(){});
  if(!(window.claude&&window.claude.use)){setStatus(false,"Abre la app desde Claude");render();return}
  window.claude.use("db").then(function(d){
    db=d;
    if(!db){setStatus(false,"Sin acceso a los datos");render();return}
    stTimer=setTimeout(function(){setStatus(false,"No se pudo conectar todavía")},10000);
    Object.keys(S).forEach(function(c){
      db.collection(c).onSnapshot(function(snap){
        S[c]=snap.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});
        if(!snap.metadata.fromCache){loaded[c]=1}
        if(Object.keys(loaded).length===Object.keys(S).length){clearTimeout(stTimer);setStatus(true,"Datos sincronizados")}
        render();
      },function(e){setStatus(false,"Error de conexión: "+(e&&e.code||""))});
    });
  });
}
function clean(o){var r={};Object.keys(o).forEach(function(k){if(k!=="id"&&o[k]!==undefined)r[k]=o[k]});return r}
function save(c,id,data){
  if(!db){toast("Sin conexión con los datos");return Promise.reject()}
  data=clean(data);data.actualizado=Date.now();
  var p=id?db.doc(c+"/"+id).set(data):db.collection(c).add(Object.assign({creado:Date.now()},data));
  return p.then(function(r){toast(id?"Cambios guardados":"Guardado");return r},function(e){toast(e&&e.code==="quota_exceeded"?"Se alcanzó el límite de registros":"No se pudo guardar. Intenta de nuevo.");throw e});
}
function patch(c,id,data){if(!db)return;return db.doc(c+"/"+id).update(data).catch(function(){toast("No se pudo actualizar")})}
function remove(c,id){if(!db)return;return db.doc(c+"/"+id).delete().then(function(){toast("Eliminado")},function(){toast("No se pudo eliminar")})}

function mesesCard(MR){

function kpi(l,v,s){return '<div class="card kpi"><div class="l">'+esc(l)+'</div><div class="v">'+v+'</div><div class="s">'+esc(s)+'</div></div>'}
function emptyBox(t,s,c){return '<div class="empty"><b>'+esc(t)+'</b>'+esc(s)+(c?'<br><button class="btn" data-new="'+c+'">'+ic("plus")+'Agregar '+esc(SCH[c].one)+'</button>':'')+'</div>'}
function chart(MR){
  MR=MR||mesesRes();
  var t=pdate(today()),ms=[];for(var i=5;i>=0;i--){var d=new Date(t.getFullYear(),t.getMonth()-i,1);ms.push(d.getFullYear()+"-"+pad(d.getMonth()+1))}
  var inc=ms.map(function(m){return MR[m]?MR[m].neto:0});
  var gas=ms.map(function(m){return MR[m]?MR[m].gastos:0});
  var mx=Math.max.apply(null,inc.concat(gas).concat([1000000]));
  var step=niceStep(mx);var top=Math.ceil(mx/step)*step;
  var W=560,H=210,L=56,B=26,T=10,R=8,pw=W-L-R,ph=H-B-T,gw=pw/6,bw=Math.min(22,gw/3.2);

  for(var v=0;v<=top+1e-9;v+=step){var y=T+ph-(v/top)*ph;s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="var(--mut)">'+short(v)+'</text>'}
  ms.forEach(function(m,i){var cx=L+gw*i+gw/2;var h1=(inc[i]/top)*ph,h2=(gas[i]/top)*ph;
    s+='<rect x="'+(cx-bw-2)+'" y="'+(T+ph-h1)+'" width="'+bw+'" height="'+h1+'" rx="3" fill="var(--accent)"><title>'+money(inc[i])+'</title></rect>';
    s+='<rect x="'+(cx+2)+'" y="'+(T+ph-h2)+'" width="'+bw+'" height="'+h2+'" rx="3" fill="var(--mut)" fill-opacity=".45"><title>'+money(gas[i])+'</title></rect>';
    var lab=pdate(m+"-01").toLocaleDateString("es-CL",{month:"short"});s+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle" font-size="11.5" fill="var(--mut)">'+esc(lab)+'</text>'});
  return s+'</svg>';
}
function niceStep(mx){var raw=mx/4;var p=Math.pow(10,Math.floor(Math.log10(raw)));var n=raw/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}
function short(v){if(v>=1e6)return "$"+(v/1e6).toLocaleString("es-CL",{maximumFractionDigits:1})+"M";if(v>=1e3)return "$"+Math.round(v/1e3)+"k";return "$"+Math.round(v)}

function searchText(c,r){var parts=[];SCH[c].fields.forEach(function(f){var v=r[f.k];if(f.t==="ref")v=nameOf(f.ref,v);if(f.t==="multi")v=(v||[]).map(function(x){return nameOf(f.ref,x)}).join(" ");parts.push(v)});return parts.join(" ").toLowerCase()}
function sorter(c){

function slug(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9]+/g,"_").replace(/^_|_$/g,"").slice(0,60)}
function cotFileName(p){return "COT"+p.numero+"-"+String(p.fecha||today()).slice(0,4)+"_"+slug(p.proyecto||p.servicio||"cotizacion")+(p.cliente&&(p.cliente.empresa||p.cliente.nombre)?"_"+slug(p.cliente.empresa||p.cliente.nombre):"")+".pdf"}
function savePdf(bytes,name){if(!downloads){toast("La descarga no está disponible aquí");return Promise.resolve(false)}
  return downloads.save({filename:name,data:new Blob([bytes],{type:"application/pdf"})}).then(function(){toast("PDF listo");return true},function(e){if(!(e&&(e.code==="dismissed"||e.code==="declined")))toast("No se pudo descargar el PDF");return false})}
function fichaPDF(r,share){var pend=svFotos(r).some(function(f){var c=IMGC[f.src];return !c||!(c.bytes||c.err)});if(pend){toast("Preparando la ficha…");preloadSv(r).then(function(){fichaPDF(r,false)});return}
  var bytes=buildFichaPDF(r),name="Ficha_tecnica_Dryco_Chile_"+slug(r.titulo||r.nombre)+".pdf";
  if(share){try{var f=new File([bytes],name,{type:"application/pdf"});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:r.titulo||r.nombre}).catch(function(e){if(!e||e.name!=="AbortError")savePdf(bytes,name)});return}}catch(e){}}
  savePdf(bytes,name)}
function qpGenerate(withPdf){
  var T=cotTotals(qp);

  if(!T.neto){toast("Ingresa la superficie y el valor por m²");var f2=document.getElementById("qp_m2");if(f2)f2.focus();return}
  if(!String(qp.numero||"").trim()){toast("Falta el N° de cotización");return}
  var snap=JSON.parse(JSON.stringify(qp));delete snap.cotId;delete snap._seen;delete snap._tplProyecto;delete snap._numEdited;
  if(withPdf)savePdf(buildCotPDF(snap),cotFileName(snap));
  if(!db){toast("Sin conexión: el PDF se generó pero no se guardó");return}
  var pc=qp.clienteId?Promise.resolve(qp.clienteId):db.collection("clientes").add({nombre:qp.cliente.empresa||qp.cliente.nombre,tipo:qp.cliente.empresa?"Comunidad / edificio":"Persona",contacto:qp.cliente.empresa?qp.cliente.nombre:null,rut:qp.cliente.rut||null,telefono:qp.cliente.telefono||null,email:qp.cliente.email||null,comuna:qp.cliente.comuna||null,direccion:qp.cliente.direccion||null,notas:null,creado:Date.now()}).then(function(r){qp.clienteId=r.id;return r.id});

      notas:ex&&ex.notas?ex.notas:(qp.iva==="No"?"Valor sin IVA. ":"")+"Total "+money(T.total)+".",pdf:Object.assign(snap,{clienteId:cid})};
    if(ex){data.creado=ex.creado||Date.now()}

function czCalc(){var f=1+(+cz.perd||0)/100,rows=[],mat=0;
  czMats().forEach(function(m){var base=(m.rendUnidad==="ml"?(+cz.ml||0):(+cz.m2||0))*f;var u=Math.ceil(base/(+m.rendimiento)-1e-9);var neto=u*(+m.precio||0)/(1+IVA);var on=czOn(m);if(on)mat+=neto;rows.push({m:m,base:base,u:u,neto:neto,on:on})});

  var costo=mat+men+pet+mo,venta=(+cz.m2||0)*(+cz.pm2||0),gan=venta-costo;
  var mg=Math.min(95,Math.max(0,+cz.margen||0))/100;var pmin=cz.m2?costo/(1-mg)/cz.m2:0;
