esumen": "Detenemos filtraciones en terrazas, balcones y jardineras trabajando sobre los puntos por donde entra el agua: canterías, sellos perimetrales, desagües y encuentros con muros. Si el revestimiento está firme, lo hacemos sin demolición.", "servicio": "Terrazas", "sistema": "Vaciado | Herramienta oscilante o disco + aspiración HEPA | Profundidad pareja y sin polvo: retiene el 99,97 % de partículas de 0,3 µm\nSellos | Poliuretano elástico con cordón de respaldo | Muros, antepechos, ventanales, umbrales y desagües\nFragüe | Litokol Starlike® Pro, epóxico bicomponente | Antimicrobiano (ISO 22196) · absorción máx. 0,1 g · resiste rayos UV y choque térmico\nLosa (si corresponde) | Membrana de poliuretano y sello alifático | Cuando hay baldosas sueltas, losa dañada o filtraciones repetidas\nControl | Prueba con agua | Entrega con garantía por escrito y registro fotográfico", "solucion": "Fragüe epóxico Starlike® Pro: antimicrobiano, resistente a rayos UV y a cambios de temperatura, en 75 colores\nSellos perimetrales elásticos de poliuretano con cordón de respaldo\nAspiración con filtro HEPA al vaciar canterías: sin polvo en muros, ventanales ni áreas comunes\nSi hay baldosas sueltas o losa dañada: impermeabilización completa de la losa y revestimiento nuevo", "titulo": "Impermeabilización de terrazas", "url": "https://drycochile.cl/impermeabilizacion-de-terrazas", "id": "terrazas"}], "guias": [{"titulo": "¿Por qué se filtra mi terraza al departamento de abajo?", "servicio": "Terrazas", "url": "https://drycochile.cl/por-que-se-filtra-mi-terraza", "resumen": "Las 6 causas más comunes de filtración en terrazas, cómo identificar cuál es su caso y cuándo basta con fragüe epóxico, sin demoler.", "creado": 1794462000000, "contenido": "## Síntomas y punto de partida\nManchas, goteras o pintura soplada en el cielo del departamento de abajo suelen aparecer después de lluvias fuertes o al lavar la terraza. En muchos casos la solución no requiere demoler el piso.\n## Las 6 causas más comunes\n### 1. Fragüe fisurado o poroso\nEl fragüe tradicional absorbe agua y se agrieta con los cambios de temperatura. Por las juntas entra la mayor parte del agua.\n### 2. Encuentros sin sello elástico\nLas uniones con muros, antepechos y marcos de ventanal se mueven. Si se sellaron con material rígido, se abren.\n### 3. Desagües obstruidos o mal sellados\nHojas o tierra tapan el desagüe, o su unión con la losa deja pasar agua aunque no esté tapado.\n### 4. Pendientes deficientes\nSi el agua forma pozas, queda horas sobre el fragüe y termina infiltrándose.\n### 5. Baldosas sueltas o huecas\nUn sonido hueco al golpear indica que perdieron adherencia y que el agua circula por debajo.\n### 6. Impermeabilización de la losa vencida o dañada\nUna membrana gastada o dañada en una remodelación deja pasar el agua hasta la estructura.\n## Cómo saber cuál es su caso\n- Si la mancha aparece solo con lluvia intensa o al lavar, el agua viene de arriba. Si la humedad es permanente, puede ser una cañería.\n- Revise canterías, bordes, desagües y sellos, y golpee las baldosas para detectar zonas huecas.\n- Una visita técnica evalúa pendientes, desagües y encuentros antes de cotizar.\n## ¿Fragüe epóxico o impermeabilización completa?\n### Fragüe epóxico y sellos, sin demoler\nCuando las baldosas están firmes y las pendientes funcionan: se vacían las canterías, se rellenan con fragüe epóxico y se sellan muros, ventanales y desagües.\n### Impermeabilización completa de la losa\nCuando hay baldosas sueltas, pozas o membrana vencida: se retira el revestimiento, se impermeabiliza la losa y se instala un revestimiento nuevo.", "id": "guia-terraza-filtra"}, {"titulo": "Fragüe epóxico vs fragüe cementicio en terrazas: ¿cuál conviene?", "servicio": "Terrazas", "url": "https://drycochile.cl/frague-epoxico-vs-cementicio", "resumen": "Compara absorción de agua, fisuras, hongos, color y costo, y explica cómo cambiamos el fragüe sin demoler el piso.", "creado": 1794462000000, "contenido": "## Qué es cada fragüe\nEl fragüe rellena las juntas entre baldosas, que es por donde más agua entra a una terraza.\n### Fragüe cementicio\nMezcla de cemento, áridos finos y aditivos que se prepara con agua. Es económico y fácil de aplicar, pero es poroso: absorbe agua, acumula suciedad y con el tiempo se fisura y se desgrana.\n### Fragüe epóxico\nResina de dos componentes con cargas minerales. Al curar forma una junta compacta que prácticamente no absorbe agua, no se mancha y resiste los hongos. Requiere más técnica y tiempo de aplicación.\n## Las diferencias que importan\nCriterio | Fragüe epóxico | Fragüe cementicio\nAbsorción de agua | Prácticamente nula | Alta, es poroso\nFisuras y durabilidad | Mayor resistencia y adherencia | Tiende a fisurarse y soltarse\nHongos y manchas | Los resiste, fácil de limpiar | Se oscurece y acumula hongos\nColor | Parejo y estable | Cambia con la humedad y el desgaste\nAplicación | Juntas secas y limpias, dosificación exacta | Simple y rápida\nCosto | Mayor por metro de junta | Menor\n## Cómo elegir\n### Conviene el epóxico\nEn terrazas expuestas a lluvia o riego, con jardineras, con filtraciones hacia el piso de abajo o con fragüe fisurado, oscuro o desgastado, siempre que las baldosas estén firmes.\n### Puede bastar el cementicio\nEn superficies techadas o poco expuestas al agua, con presupuesto ajustado y aceptando mantenciones más frecuentes.\n## Cómo cambiamos el fragüe sin demoler\n1. Diagnóstico en terreno: revisamos juntas, baldosas, pendientes y desagües para confirmar que el agua entra por las canterías.\n2. Vaciado: retiramos el fragüe antiguo a profundidad pareja, sin dañar la baldosa y con aspiración HEPA.\n3. Relleno y sellado: aplicamos fragüe epóxico en la junta limpia y seca, y sellamos el perímetro con sellante elástico.\n4. Curado y entrega: respetamos el curado de la ficha técnica, probamos con agua si corresponde y entregamos con garantía por escrito.\n## Preguntas frecuentes\n- ¿Se puede hacer sin cambiar las baldosas? Sí, si están firmes y bien adheridas.\n- ¿Impermeabiliza toda la terraza? Sella las juntas, pero no reemplaza una membrana si la losa o las pendientes están dañadas.\n- ¿Se puede aplicar sobre el fragüe viejo? No conviene: primero hay que vaciar la cantería.\n- ¿Qué mantención necesita? Limpieza con agua y detergente neutro, y revisión anual de sellos y desagües.", "id": "guia-frague-epoxico-cementicio"}, {"titulo": "Fragüe epóxico vs membrana líquida en terrazas de porcelanato", "servicio": "Terrazas", "url": "https://drycochile.cl/frague-epoxico-vs-membrana-liquida", "resumen": "Por qué el agua entra por las juntas y no por la baldosa, y cuándo conviene sellar con fragüe epóxico en vez de cubrir todo el piso.", "creado": 1794462000000, "contenido": "## Punto de partida\nEl porcelanato absorbe 0,5 % de agua o menos (norma ISO 13006). Por eso, en una terraza de porcelanato el agua entra por las juntas entre baldosas, no por la palmeta.\n## Qué es cada alternativa\n### Membrana líquida\nRecubrimiento, normalmente de poliuretano, que se aplica con rodillo sobre todo el piso. Sobre porcelanato necesita imprimante para adherirse y forma una película delgada que sufre tránsito, sol y desgaste, por lo que requiere recapados periódicos.\n### Fragüe epóxico Starlike® Pro\nGel epóxico fabricado en Italia que el fabricante indica para terrazas y balcones. Reemplaza el fragüe antiguo de la junta sin cubrir el porcelanato. Sus microesferas de cuarzo dejan menos huecos que un árido estándar, lo que reduce la porosidad.\n## Propiedades declaradas en la ficha técnica\n- Impermeabilidad: absorción de 0,1 g de agua o menos en 4 horas (EN 12808-5).\n- Antimicrobiano: protección contra bacterias y moho (ISO 22196).\n- Exposición: resistente a rayos UV, en servicio entre -20 °C y +100 °C.\n- Certificaciones de bajas emisiones EMICODE EC1 PLUS y A+.\n## Membrana líquida vs Starlike® Pro\nCriterio | Starlike® Pro | Membrana líquida\nZona que protege | Las juntas, por donde entra el agua | Toda la superficie del piso\nAspecto del piso | Sin cambios, con juntas nuevas | Película con brillo o color propio\nDesgaste | Junta rehundida, protegida del tránsito | Película expuesta a pisadas y muebles\nHongos y limpieza | Antimicrobiano y antimanchas | La junta antigua queda debajo\nMantención | Agua y detergente neutro | Recapados periódicos\nTiempo sin uso | Tránsito a las 24 h, uso normal a los 5 días | Hasta 7 días\n## Cómo lo aplicamos\n1. Diagnóstico en terreno: revisamos canterías, pendientes, desagües y encuentros con muros.\n2. Retiro del fragüe antiguo con herramienta oscilante o disco diamantado, a profundidad pareja y con aspiración HEPA.\n3. Aplicación de Starlike® Pro en la junta limpia y seca, y sellado perimetral con cordón de respaldo y sellante elástico.\n4. Curado y entrega con registro fotográfico y garantía por escrito.\n## Mantención\n- Limpieza periódica con agua y detergente neutro.\n- Revisión anual de sellos perimetrales y desagües.", "id": "guia-frague-vs-membrana"}, {"titulo": "Membrana asfáltica o poliuretano: ¿cuál conviene para su cubierta?", "servicio": "Cubiertas", "url": "https://drycochile.cl/membrana-asfaltica-vs-poliuretano", "resumen": "Compara ambos sistemas en uniones, encuentros, reflectividad y mantención, y explica cuándo conviene cada uno.", "creado": 1794462000000, "contenido": "## Qué es cada sistema\n### Membrana líquida de poliuretano\nSe aplica en estado líquido y forma una capa continua, sin uniones. Se adapta a formas irregulares, puentea fisuras y su terminación blanca refleja la radiación solar.\n### Membrana asfáltica bicapa\nDos rollos superpuestos y soldados con calor. Forma una doble barrera de buen espesor, probada en losas planas, y exige cuidar traslapes y encuentros.\n## Las diferencias que importan\nCriterio | Poliuretano | Bicapa asfáltica\nUniones | Ninguna, capa continua | Traslapes soldados que deben quedar perfectos\nDuctos y formas complejas | Se adapta a ductos, esquinas y antepechos | Requiere cortes y piezas especiales\nCalor bajo la cubierta | Terminación blanca que refleja el sol | Oscura, salvo terminación mineral o pintura\nReparaciones | Se aplica una nueva capa encima | Parches soldados en las zonas dañadas\n## Cómo elegir\n### Conviene el poliuretano\nEn cubiertas con muchos ductos, equipos o antepechos, cubiertas metálicas o de forma irregular, y cuando se busca una superficie reflectante que baje la temperatura bajo la losa.\n### Conviene la bicapa asfáltica\nEn losas planas, amplias y despejadas.\n### En ambos casos\nNingún sistema dura sin una buena preparación: pendientes correctas, desagües limpios, fisuras tratadas y refuerzo en los puntos críticos.\n## Así lo resolvemos en Dryco Chile\n1. Inspección y diagnóstico: pendientes, desagües, juntas, encuentros y estado de la membrana existente.\n2. Preparación: retiro de la membrana dañada y limpieza con aspiración HEPA.\n3. Refuerzo y aplicación: refuerzo de puntos críticos, imprimación según el soporte y aplicación por capas.\n4. Control y garantía: prueba de estanqueidad antes de la recepción y garantía por escrito.", "id": "guia-asfaltica-vs-poliuretano"}, {"titulo": "Filtraciones en estacionamientos subterráneos: causas y soluciones", "servicio": "Subterráneos y estacionamientos", "url": "https://drycochile.cl/filtraciones-estacionamientos-subterraneos", "resumen": "Explica si el agua viene del terreno o de la losa superior, las seis causas más comunes y qué reparación corresponde en cada caso.", "creado": 1794462000000, "contenido": "## Dos orígenes, dos tratamientos distintos\n- Desde el terreno: el agua empuja contra muros y losa de fondo. Se trata desde el interior del recinto.\n- Desde arriba: el agua baja desde la losa superior, patios, jardineras o rampas. Se repara desde abajo y se impermeabiliza la superficie expuesta.\n## Las seis causas más comunes y su solución\n### Grietas en losas y muros\nSeñal: líneas húmedas, goteo o manchas blancas. Solución: inyección de resina de poliuretano expansiva si hay agua activa, o epóxica si la fisura está seca.\n### Juntas de dilatación deterioradas\nSeñal: agua que cae en línea sobre la junta. Solución: retirar el sello antiguo y colocar sellante elástico con cordón de respaldo.\n### Canaletas y sumideros\nSeñal: manchas y goteo bajo canaletas, rejillas o bajadas. Solución: limpiar, reparar uniones, corregir pendientes y revestir con membrana continua.\n### Encuentros muro-losa y juntas de hormigonado\nSeñal: humedad en franjas horizontales o en la unión muro-losa. Solución: abrir y sellar el encuentro, inyectar si pasa agua y reforzar con mortero impermeable o cristalizante.\n### Losa superior, rampas y jardines\nSeñal: la filtración aumenta con lluvia o riego. Solución: membrana o revestimiento apto para tránsito y revisión de desagües y pendientes.\n### Pasadas de ductos y cañerías\nSeñal: humedad alrededor de tuberías que atraviesan muros o losas. Solución: mortero de obturación, inyección o sellante elástico, según la presión del agua.\n## Cómo identificar el origen antes de reparar\n- Si la humedad aumenta con lluvia o riego, viene de arriba. Si persiste en temporada seca, suele venir del terreno.\n- Un goteo puntual indica una grieta o junta abierta; las manchas blancas, agua con sales.\n- Evite parches sin diagnóstico, como pintura impermeabilizante o silicona por el interior: rara vez resisten la presión.\n## Cómo reparamos un estacionamiento con filtraciones\n1. Inspección y mapeo de grietas, juntas y zonas húmedas, incluida la losa superior.\n2. Propuesta por sectores, para que el estacionamiento siga funcionando.\n3. Reparación de puntos críticos: inyecciones, sellado de juntas y reparación de hormigón.\n4. Control con prueba de agua, registro fotográfico y garantía por escrito.\n## Preguntas frecuentes\n- ¿Hay que cerrar el estacionamiento? Normalmente no: se trabaja por sectores coordinados con la administración.\n- ¿Se puede reparar sin excavar? En la mayoría de los casos sí, desde el interior.\n- ¿Cada cuánto revisar? Una vez al año, idealmente antes de las lluvias.", "id": "guia-estacionamientos"}, {"titulo": "Salas técnicas: cómo elegir el revestimiento correcto", "servicio": "Salas técnicas", "url": "https://drycochile.cl/guia-revestimiento-salas-tecnicas", "resumen": "Qué revestimiento conviene para salas de bombas, calderas y acumuladores (poliuretano, epóxico o poliuretano-cemento) sin detener la operación.", "creado": 1794462000000, "contenido": "## Cuándo hay que intervenir\n- Eflorescencias y salitre: manchas blancas que indican humedad dentro de la estructura.\n- Fisuras por vibración: bombas y motores abren vías de filtración.\n- Corrosión de armaduras: la humedad y los químicos dañan la enfierradura y los anclajes de los equipos.\n- Pintura ampollada o suelta: las pinturas de piso comunes no resisten humedad, calor ni derrames.\n## Qué ofrece cada revestimiento\nSistema | Característica principal | Uso típico\nPoliuretano elastomérico | Membrana elástica que absorbe vibración y puentea microfisuras | Salas con filtración o vibración\nEpóxico | Superficie dura, lavable y antideslizante | Salas con químicos y lavado frecuente\nPoliuretano-cemento | Resiste impacto, temperatura y químicos | Agua caliente, vapor o combustibles\n## Qué sistema va en cada sala\n- Sala de bombas de piscina: poliuretano elastomérico si hay filtración o vibración; epóxico con cuarzo si se manejan químicos.\n- Sala de boiler y acumuladores: poliuretano reforzado con fibra de vidrio, o autonivelante de poliuretano bajo los tanques.\n- Sala de calderas: poliuretano-cemento si hay purgas de agua caliente o vapor; epóxico de alta resistencia si la temperatura es moderada.\n- Salas de máquinas: revestimientos de alta dureza para tránsito de mantención, herramientas y derrames de aceite.\n## Sin detener la operación\n1. Inspección y medición de la humedad del soporte antes de elegir el sistema.\n2. Desbaste con aspiración HEPA para abrir el poro sin levantar polvo.\n3. Tratamiento de medias cañas, juntas y pasadas de cañerías con selladores integrados al sistema.\n4. Aplicación por capas, control de continuidad y adherencia, y entrega con acta de recepción y garantía escrita.", "id": "guia-salas-tecnicas"}], "plantillas": [{"beneficios": "Aplicado proporciona una membrana elástica, flexible y sin juntas que evita la filtración.\nResistente al agua estancada. No emulsionable.\nMantiene sus propiedades mecánicas en temperaturas de –30 °C a +90 °C.\nRepara grietas de hasta 2 mm, incluso a –10 °C.\nPermite la transpiración del vapor de agua.\nTotalmente estable frente a los álcalis presentes en el hormigón.", "creado": 1794448000000, "garantia": 18, "items": "PREPARACIÓN DE SUPERFICIE | Escobillado completo de la superficie. Se elimina cáscara de laminación, óxido, pintura y cualquier material incrustante. Limpieza de agentes contaminantes y/o corrosivos y de todas las impurezas que puedan ocasionar fallas prematuras en el sistema de protección. | Ud\nDRYCOFLEX 600 PU · PATE | Sellador elastomérico de poliuretano de 1 componente, que no descuelga y cura con la humedad del ambiente. Capacidad de movimiento ± 35 %. Uso interior y exterior, alto rendimiento mecánico y elástico, con resistencia UV. Para hormigón, madera y metales. | Ud\nIMPERMEABILIZANTE POLIMÉRICO ELÁSTICO | Revestimiento polimérico elástico aplicado en 2 capas (2 kg/m²), duradero y flexible, de altas prestaciones, con retornos bajo el mismo sistema de protección. | Tineta\nGEOTEXTIL | Refuerzo de filamentos continuos de poliéster de alta tenacidad, con mayor resistencia a la tracción, punzonado, reventado y corte trapezoidal, para una mayor calidad del sistema de impermeabilización. | Ud", "nombre": "Cubierta · Acrílica elástica", "nota": "Nuestros productos de sellado, impermeabilización y reparación de concreto se combinan para crear mantos impermeables completos y sin juntas, que devuelven la vida a las estructuras erosionadas por la humedad y ev /* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function money(n){return "$ •••"}
function num(n){return (+n||0).toLocaleString("es-CL",{maximumFractionDigits:2})}
function pad(n){return (n<10?"0":"")+n}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function today(){return iso(new Date())}
function addDays(s,n){var p=s.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()+n);return iso(d)}
function pdate(s){if(!s)return null;var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function fdate(s,long){var d=pdate(s);if(!d)return "";return d.toLocaleDateString("es-CL",long?{weekday:"long",day:"numeric",month:"long"}:{day:"numeric",month:"short",year:(s.slice(0,4)==today().slice(0,4)?undefined:"numeric")})}
function sum(a,f){return a.reduce(function(t,x){return t+(+f(x)||0)},0)}
function byId(c,id){if(!id)return null;for(var i=0;i<S[c].length;i++)if(S[c][i].id===id)return S[c][i];return null}
function nameOf(c,id){var r=byId(c,id);if(!r)return "";return c==="cotizaciones"?("COT "+r.numero):(r.nombre||r.titulo||"")}
function ventaTotal(v){return Math.round((+v.cantidad||0)*(+v.precioUnit||0)+(+v.despacho||0))}
function cobIva(x,o){var v=x&&x.conIva;if(v==="Sin IVA"||v==="No")return false;if(v==="Con IVA"||v==="Sí")return true;return !(o&&o.conIva==="No")}
function cobNeto(x,o){var m=+x.monto||0;return cobIva(x,o)?m/(1+IVA):m}
function antPct(o){var p=+(o&&o.anticipoPct);return p>0&&p<=100?p:60}
function gCost(x){var m=+x.monto||0;return x.documento==="Factura"?Math.round(m/(1+IVA)):m}
function gIva(x){var m=+x.monto||0;return x.documento==="Factura"?m-Math.round(m/(1+IVA)):0}
function obraCalc(o){var g=sum(S.gastos.filter(function(x){return x.obraId===o.id}),gCost);var cb=S.cobros.filter(function(x){return x.obraId===o.id});var c=sum(cb,function(x){return x.monto});var cn=sum(cb,function(x){return cobNeto(x,o)});var neto=+o.neto||0;var f=o.conIva==="No"?1:1+IVA;var total=Math.round(neto*f);var pn=neto-cn;var pc=pn>5?Math.round(pn*f):0;return {gastos:g,cobrado:c,cobradoNeto:Math.round(cn),total:total,porCobrar:pc,ganancia:neto-g,margen:neto?(neto-g)/neto:0}}
function obraCaja(o){var ant=0,fin=0;S.cobros.forEach(function(x){if(x.obraId!==o.id)return;var m=cobNeto(x,o);if(x.tipo==="Saldo final")fin+=m;else ant+=m});var g=obraCalc(o).gastos;return {ant:Math.round(ant),fin:Math.round(fin),gastos:g,ganancia:Math.round(ant+fin-g)}}
function obraFecha(o){return o.termino||o.inicio||((byId("cotizaciones",o.cotizacionId)||{}).fecha)||""}
/* Resultados por mes: cada proyecto cuenta completa (venta y todos sus gastos) en el mes en que termina.
   Las obras sin terminar no suman hasta que terminan; sus números nunca se reparten entre meses.
   Los gastos generales (sin obra) cuentan en el mes de su fecha. */
function mesesRes(){
  var M={};function g(m){return M[m]||(M[m]={mes:m,obras:[],neto:0,gastosObras:0,gastosGen:0})}
  S.obras.forEach(function(o){if(o.estado!=="Terminada")return;var m=obraFecha(o).slice(0,7);if(!m)return;var k=obraCalc(o),cj=obraCaja(o),r=g(m);r.obras.push(o);r.neto+=+o.neto||0;r.gastosObras+=k.gastos;r.ant=(r.ant||0)+cj.ant;r.fin=(r.fin||0)+cj.fin});
  S.gastos.forEach(function(x){if(x.obraId&&byId("obras",x.obraId))return;var m=(x.fecha||"").slice(0,7);if(!m)return;g(m).gastosGen+=gCost(x)});
  Object.keys(M).forEach(function(m){var r=M[m];r.ant=r.ant||0;r.fin=r.fin||0;r.gastos=r.gastosObras+r.gastosGen;r.ganancia=r.ant+r.fin-r.gastos;r.margen=r.neto?r.ganancia/r.neto:0});
  return M;
}

var db=null,downloads=null,stTimer=null;
function setStatus(ok,text){var s=document.getElementById("status");s.className="status"+(ok?" ok":"");s.innerHTML="<i></i>"+esc(text)}
function start(){
  window.claude&&window.claude.use&&window.claude.use("downloads").then(function(d){downloads=d;render()}).catch(function(){});
  if(!(window.claude&&window.claude.use)){setStatus(false,"Abre la app desde Claude");render();return}
  window.claude.use("db").then(function(d){
    db=d;
    if(!db){setStatus(false,"Sin acceso a los datos");render();return}
    stTimer=setTimeout(function(){setStatus(false,"No se pudo conectar todavía")},10000);
    Object.keys(S).forEach(function(c){
      db.collection(c).onSnapshot(function(snap){
        S[c]=snap.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});
        if(!snap.metadata.fromCache){loaded[c]=1}
        if(Object.keys(loaded).length===Object.keys(S).length){clearTimeout(stTimer);setStatus(true,"Datos sincronizados")}
        render();
      },function(e){setStatus(false,"Error de conexión: "+(e&&e.code||""))});
    });
  });
}
function clean(o){var r={};Object.keys(o).forEach(function(k){if(k!=="id"&&o[k]!==undefined)r[k]=o[k]});return r}
function save(c,id,data){
  if(!db){toast("Sin conexión con los datos");return Promise.reject()}
  data=clean(data);data.actualizado=Date.now();
  if(c==="cobros"){var cm=cobroCheck(id,data);if(cm){toast(cm);return Promise.reject(new Error(cm))}}
  var p=id?db.doc(c+"/"+id).set(data):db.collection(c).add(Object.assign({creado:Date.now()},data));
  if(!id&&c==="cotizaciones"&&data.numero)p=p.then(function(r){corrAfterNew(data.numero);return r});
  if(c==="cobros"&&data.tipo==="Saldo final"&&data.obraId)p=p.then(function(r){obraFinaliza(data.obraId,data.fecha);return r});
  return p.then(function(r){toast(id?"Cambios guardados":"Guardado");return r},function(e){toast(e&&e.code==="quota_exceeded"?"Se alcanzó el límite de registros":"No se pudo guardar. Intenta de nuevo.");throw e});
}
function patch(c,id,data){if(!db)return;return db.doc(c+"/"+id).update(data).catch(function(){toast("No se pudo actualizar")})}
function remove(c,id){if(!db)return;return db.doc(c+"/"+id).delete().then(function(){toast("Eliminado")},function(){toast("No se pudo eliminar")})}

function slug(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9]+/g,"_").replace(/^_|_$/g,"").slice(0,60)}
function cotFileName(p){return "COT"+p.numero+"-"+String(p.fecha||today()).slice(0,4)+"_"+slug(p.proyecto||p.servicio||"cotizacion")+(p.cliente&&(p.cliente.empresa||p.cliente.nombre)?"_"+slug(p.cliente.empresa||p.cliente.nombre):"")+".pdf"}
function savePdf(bytes,name){if(!downloads){toast("La descarga no está disponible aquí");return Promise.resolve(false)}
  return downloads.save({filename:name,data:new Blob([bytes],{type:"application/pdf"})}).then(function(){toast("PDF listo");return true},function(e){if(!(e&&(e.code==="dismissed"||e.code==="declined")))toast("No se pudo descargar el PDF");return false})}
function pdfFileName(kind,title){var t=String(title||"").replace(/[\\/:*?"<>|#%{}~&]+/g," ").replace(/\s+/g," ").trim().slice(0,80);return (t?t+" - ":"")+kind+" Dryco Chile.pdf"}
function sharePdfFile(bytes,name,title,text){var f;try{f=new File([bytes],name,{type:"application/pdf",lastModified:Date.now()})}catch(e){return savePdf(bytes,name)}
  if(!(navigator.canShare&&navigator.canShare({files:[f]})))return savePdf(bytes,name);
  var o={files:[f],title:title||name.replace(/\.pdf$/,"")};if(text)o.text=text;
  return navigator.share(o).catch(function(e){if(e&&e.name==="AbortError")return;if(e&&e.name==="NotAllowedError"){pdfReady(bytes,name,title,text);return}savePdf(bytes,name)})}
function pdfReady(bytes,name,title,text){var old=document.getElementById("pdfok");if(old)old.remove();var L=document.createElement("div");L.id="pdfok";L.className="actaw";L.style.alignItems="center";L.style.justifyContent="center";

function qpGenerate(withPdf){
  var T=cotTotals(qp);
  if(!String(qp.cliente.nombre||"").trim()&&!String(qp.cliente.empresa||"").trim()){toast("Completa el nombre del cliente");var f=document.getElementById("qp_cliente_nombre");if(f)f.focus();return}
  if(!T.neto){toast("Ingresa la superficie y el valor por m²");var f2=document.getElementById("qp_m2");if(f2)f2.focus();return}
  if(!String(qp.numero||"").trim()){toast("Falta el N° de cotización");return}
  var snap=JSON.parse(JSON.stringify(qp));delete snap.cotId;delete snap._seen;delete snap._tplProyecto;delete snap._numEdited;
  if(withPdf)savePdf(buildCotPDF(snap),cotFileName(snap));
  if(!db){toast("Sin conexión: el PDF se generó pero no se guardó");return}
  var pc=qp.clienteId?Promise.resolve(qp.clienteId):db.collection("clientes").add({nombre:qp.cliente.empresa||qp.cliente.nombre,tipo:qp.cliente.empresa?"Comunidad / edificio":"Persona",contacto:qp.cliente.empresa?qp.cliente.nombre:null,rut:qp.cliente.rut||null,telefono:qp.cliente.telefono||null,email:qp.cliente.email||null,comuna:qp.cliente.comuna||null,direccion:qp.cliente.direccion||null,notas:null,creado:Date.now()}).then(function(r){qp.clienteId=r.id;return r.id});
  pc.then(function(cid){
    var ex=qp.cotId?byId("cotizaciones",qp.cotId):S.cotizaciones.filter(function(c){return String(c.numero)===String(qp.numero)})[0];
    var tp=byId("plantillas",qp.plantillaId);
    var data={numero:String(qp.numero),fecha:qp.fecha,clienteId:cid,servicio:qp.servicio,m2:+qp.m2||null,neto:T.neto,estado:ex?ex.estado:"Enviada",seguimiento:ex&&ex.seguimiento?ex.seguimiento:addDays(qp.fecha||today(),3),
      descripcion:(qp.proyecto||qp.servicio)+(tp&&tp.id!=="general"?". Sistema: "+tp.nombre:"")+(qp.m2?". "+num(qp.m2)+" m² × "+money(qp.valorM2):"")+". Plazo "+(qp.plazo||"—")+".",
      notas:ex&&ex.notas?ex.notas:(qp.iva==="No"?"Valor sin IVA. ":"")+"Total "+money(T.total)+".",pdf:Object.assign(snap,{clienteId:cid})};
    if(ex){data.creado=ex.creado||Date.now()}
    return save("cotizaciones",ex?ex.id:null,data).then(function(r){qp.cotId=ex?ex.id:(r&&r.id);render()})
  }).catch(function(){toast("No se pudo guardar la cotización")})
}
